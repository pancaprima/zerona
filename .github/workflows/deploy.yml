name: deploy

# Zerona fork (pancaprima/zerona): autodeploy edge/ + credential vault (edge/vault)
# on push to main / workflow_dispatch. Vault deploys first (edge VAULT binding);
# vault-production requires reviewers and main-only deployment branches.
#
# CLOUDFLARE_API_TOKEN: Workers Scripts (edit) on our account (id in
# edge/wrangler.zerona.jsonc / edge/vault/wrangler.zerona.jsonc). Edge job:
# `cloudflare` environment; vault job: `vault-production` (token required — no
# silent skip). Landing/www-redirect jobs are disabled on this fork.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  # ── credential vault (edge/vault) ───────────────────────────────────────
  # Its own deploy with its own approval: the `vault-production` GitHub
  # environment carries required reviewers (and may hold its own
  # CLOUDFLARE_API_TOKEN). Change detection lives in a separate, ungated job
  # because an environment gate applies before a job's first step — folding
  # detection into the gated job would ask for approval on every push.
  vault-changes:
    if: github.repository == 'pancaprima/zerona'
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.changed.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: detect vault changes
        id: changed
        shell: bash
        run: |
          before="${{ github.event.before }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] \
            || [ -z "$before" ] || ! git cat-file -e "$before" 2>/dev/null; then
            echo "changed=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if git diff --name-only "$before" "$GITHUB_SHA" | grep -qE '^(edge/vault/|\.github/workflows/deploy\.yml)'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

  vault:
    needs: vault-changes
    if: github.repository == 'pancaprima/zerona' && needs.vault-changes.outputs.changed == 'true'
    runs-on: ubuntu-latest
    environment: vault-production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    defaults:
      run:
        working-directory: edge/vault
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: edge/vault/package-lock.json
      - name: install
        run: npm ci
      - name: typecheck
        run: npm run typecheck
      - name: test
        run: npm test
      # Fork: fail closed if the vault-production token is missing (edge must not bind to a missing worker).
      - name: require token
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN is not set in the vault-production environment"
            exit 1
          fi
      - name: deploy
        run: npx wrangler deploy -c wrangler.zerona.jsonc

  # Run after vault (or after vault was skipped); never after vault failed or was cancelled.
  edge:
    needs: [vault-changes, vault]
    if: ${{ always() && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
    runs-on: ubuntu-latest
    environment: cloudflare
    env:
      # `secrets` is not a valid context in step `if:` expressions — surface
      # the token through job env and gate on that instead.
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # `github.event.before` may precede several commits in a batched push.
          fetch-depth: 0
      - name: detect edge changes
        id: changed
        shell: bash
        run: |
          before="${{ github.event.before }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] \
            || [ -z "$before" ] || ! git cat-file -e "$before" 2>/dev/null; then
            echo "changed=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if git diff --name-only "$before" "$GITHUB_SHA" | grep -qE "^(edge/|apps/card-web/|\.github/workflows/deploy\.yml)"; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: steps.changed.outputs.changed == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: edge/package-lock.json
      - name: install
        if: steps.changed.outputs.changed == 'true'
        working-directory: edge
        run: npm ci
      - name: typecheck
        if: steps.changed.outputs.changed == 'true'
        working-directory: edge
        run: npm run typecheck
      - name: test
        if: steps.changed.outputs.changed == 'true'
        working-directory: edge
        run: npm test
      # The member card pages' static files (apps/card-web/site, its art)
      # into edge/public, which wrangler uploads as the worker's assets.
      - name: card assets
        if: steps.changed.outputs.changed == 'true'
        working-directory: edge
        run: npm run card-assets
      - name: deploy
        if: steps.changed.outputs.changed == 'true' && env.CLOUDFLARE_API_TOKEN != ''
        working-directory: edge
        run: npx wrangler deploy -c wrangler.zerona.jsonc

  # Static landing page (zeron.sh) — assets-only worker, no build step.
  landing:
    if: false
    runs-on: ubuntu-latest
    environment: cloudflare
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: detect landing changes
        id: changed
        shell: bash
        run: |
          before="${{ github.event.before }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] \
            || [ -z "$before" ] || ! git cat-file -e "$before" 2>/dev/null; then
            echo "changed=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if git diff --name-only "$before" "$GITHUB_SHA" | grep -qE "^(apps/landing/|\.github/workflows/deploy\.yml)"; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: steps.changed.outputs.changed == 'true'
        with:
          node-version: 22
      - name: test
        if: steps.changed.outputs.changed == 'true'
        working-directory: apps/landing
        run: node --test *.test.mjs
      - name: deploy
        if: steps.changed.outputs.changed == 'true' && env.CLOUDFLARE_API_TOKEN != ''
        working-directory: apps/landing
        run: npx wrangler@4 deploy

  # www.zeron.sh → zeron.sh 301 (see apps/www-redirect/wrangler.jsonc).
  www-redirect:
    if: false
    runs-on: ubuntu-latest
    environment: cloudflare
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: detect www-redirect changes
        id: changed
        shell: bash
        run: |
          before="${{ github.event.before }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] \
            || [ -z "$before" ] || ! git cat-file -e "$before" 2>/dev/null; then
            echo "changed=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if git diff --name-only "$before" "$GITHUB_SHA" | grep -qE "^(apps/www-redirect/|\.github/workflows/deploy\.yml)"; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: steps.changed.outputs.changed == 'true'
        with:
          node-version: 22
      - name: deploy
        if: steps.changed.outputs.changed == 'true' && env.CLOUDFLARE_API_TOKEN != ''
        working-directory: apps/www-redirect
        run: npx wrangler@4 deploy
