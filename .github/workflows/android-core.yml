name: Android core

on:
  pull_request:
    paths:
      - 'crates/mobile/**'
      - 'crates/client/**'
      - 'scripts/android/**'
      - '.github/workflows/android-core.yml'
      - 'Cargo.lock'
  push:
    branches: [main]
    paths:
      - 'crates/mobile/**'
      - 'crates/client/**'
      - 'scripts/android/**'
      - '.github/workflows/android-core.yml'
      - 'Cargo.lock'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-core-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Rust toolchain
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup target add aarch64-linux-android x86_64-linux-android
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true
      - name: Android NDK
        run: |
          if [[ -z "${ANDROID_NDK_HOME:-}" ]]; then
            echo "ANDROID_NDK_HOME is unset; installing NDK via sdkmanager" >&2
            sdkmanager --install "ndk;27.2.12479018"
            echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
          fi
          echo "$ANDROID_NDK_HOME"
          if [[ ! -d "${ANDROID_NDK_HOME:-}" ]]; then
            echo "ANDROID_NDK_HOME is unset or not a directory: ${ANDROID_NDK_HOME:-}" >&2
            exit 1
          fi
          ls -la "$ANDROID_NDK_HOME"
      - name: Install cargo-ndk
        run: |
          if command -v cargo-ndk >/dev/null; then
            echo "cargo-ndk already installed: $(command -v cargo-ndk)"
          else
            cargo install cargo-ndk --locked
          fi
      - name: Build mobile core for Android
        run: REQUIRE_SO=1 scripts/android/build-core.sh "$GITHUB_WORKSPACE/target/android-core"
      - name: Verify Android core outputs
        run: |
          out="$GITHUB_WORKSPACE/target/android-core"
          arm="$out/jniLibs/arm64-v8a/libzeron_mobile.so"
          x86="$out/jniLibs/x86_64/libzeron_mobile.so"
          for lib in "$arm" "$x86"; do
            if [[ ! -f "$lib" ]]; then
              echo "missing $lib" >&2
              exit 1
            fi
            ls -l "$lib"
          done
          mapfile -t kts < <(find "$out/kotlin" -type f -name '*.kt' | sort)
          if (( ${#kts[@]} < 1 )); then
            echo "no .kt files under $out/kotlin" >&2
            ls -laR "$out/kotlin" || true
            exit 1
          fi
          printf '%s\n' "${kts[@]}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: android-core
          path: |
            target/android-core/kotlin
            target/android-core/jniLibs
          if-no-files-found: error
          retention-days: 7
