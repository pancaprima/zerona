name: Android app

on:
  pull_request:
    paths:
      - 'apps/android/**'
      - 'crates/mobile/**'
      - 'crates/client/**'
      - 'scripts/android/**'
      - '.github/workflows/android-app.yml'
      - 'Cargo.lock'
  push:
    branches: [main]
    paths:
      - 'apps/android/**'
      - 'crates/mobile/**'
      - 'crates/client/**'
      - 'scripts/android/**'
      - '.github/workflows/android-app.yml'
      - 'Cargo.lock'
  workflow_dispatch:
    inputs:
      abis:
        description: 'Comma-separated ABIs to package (e.g. arm64-v8a or arm64-v8a,x86_64)'
        required: false
        default: 'arm64-v8a'

permissions:
  contents: read

concurrency:
  group: android-app-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NDK_VERSION: 29.0.14206865
  ZERON_ANDROID_ABIS: ${{ github.event_name == 'workflow_dispatch' && inputs.abis || 'arm64-v8a' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
      - name: Android SDK packages
        run: sdkmanager --install "platforms;android-37.0" "build-tools;37.0.0" "ndk;$NDK_VERSION"
      - name: Rust toolchain (rust-toolchain.toml)
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup target add aarch64-linux-android x86_64-linux-android
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true
      - name: build tools (cargo-ndk, rsvg-convert)
        run: |
          cargo install cargo-ndk --locked
          sudo apt-get update -q && sudo apt-get install -y -q librsvg2-bin
      - name: assemble debug APK
        working-directory: apps/android
        run: ./gradlew :app:assembleDebug -PzeronVersionCode="${{ github.run_number }}" --console=plain --no-configuration-cache
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: zerona-android-debug
          path: apps/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Check private release signing secrets
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        env:
          ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          ANDROID_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
          ANDROID_RELEASE_CERT_SHA256: ${{ secrets.ANDROID_RELEASE_CERT_SHA256 }}
        run: |
          set -euo pipefail
          missing=()
          for name in \
            ANDROID_RELEASE_KEYSTORE_BASE64 \
            ANDROID_RELEASE_STORE_PASSWORD \
            ANDROID_RELEASE_KEY_ALIAS \
            ANDROID_RELEASE_KEY_PASSWORD \
            ANDROID_RELEASE_CERT_SHA256
          do
            if [[ -z "${!name:-}" ]]; then
              missing+=("$name")
            fi
          done
          if (( ${#missing[@]} > 0 )); then
            echo "Private release build on main requires GitHub Actions secrets (values not shown):" >&2
            printf '  - %s\n' "${missing[@]}" >&2
            exit 1
          fi
      - name: Decode release keystore
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        env:
          ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          ANDROID_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          keystore="$RUNNER_TEMP/zerona-release.keystore"
          printf '%s' "$ANDROID_RELEASE_KEYSTORE_BASE64" | base64 -d > "$keystore"
          chmod 600 "$keystore"
          {
            echo "ZERON_ANDROID_KEYSTORE=$keystore"
            echo "ZERON_ANDROID_KEYSTORE_PASSWORD=$ANDROID_RELEASE_STORE_PASSWORD"
            echo "ZERON_ANDROID_KEY_ALIAS=$ANDROID_RELEASE_KEY_ALIAS"
            echo "ZERON_ANDROID_KEY_PASSWORD=$ANDROID_RELEASE_KEY_PASSWORD"
          } >> "$GITHUB_ENV"
          keystore_bytes="$(wc -c < "$keystore" | tr -d ' ')"
          echo "Release keystore written: ${keystore_bytes} bytes"
          set +e
          keytool_sha="$(keytool -list -v -keystore "$keystore" -storepass "$ANDROID_RELEASE_STORE_PASSWORD" -alias "$ANDROID_RELEASE_KEY_ALIAS" 2>&1 | grep -E 'SHA256:|SHA-256:')"
          keytool_ec=${PIPESTATUS[0]}
          set -e
          if (( keytool_ec != 0 )); then
            echo "keytool failed to read keystore alias (exit ${keytool_ec}); check ANDROID_RELEASE_KEY_ALIAS and store password" >&2
            exit 1
          fi
          if [[ -z "$keytool_sha" ]]; then
            echo "keytool did not report SHA-256 for alias $ANDROID_RELEASE_KEY_ALIAS" >&2
            exit 1
          fi
          echo "Keystore certificate fingerprint (keytool):"
          printf '%s\n' "$keytool_sha"
      - name: Assemble signed release APK (private)
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        working-directory: apps/android
        run: |
          set -euo pipefail
          ./gradlew --stop
          if test -f "$ZERON_ANDROID_KEYSTORE"; then
            echo "ZERON_ANDROID_KEYSTORE present: yes"
          else
            echo "ZERON_ANDROID_KEYSTORE present: no"
          fi
          ./gradlew :app:assembleRelease -PzeronVersionCode="${{ github.run_number }}" --console=plain --no-configuration-cache
      - name: Verify release APK signature (apksigner)
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        env:
          ANDROID_RELEASE_CERT_SHA256: ${{ secrets.ANDROID_RELEASE_CERT_SHA256 }}
        run: |
          set -euo pipefail
          apk="apps/android/app/build/outputs/apk/release/app-release.apk"
          if [[ ! -f "$apk" ]]; then
            echo "Release APK not found: $apk" >&2
            exit 1
          fi
          apksigner_bin="${ANDROID_HOME}/build-tools/37.0.0/apksigner"
          set +e
          cert_out="$("$apksigner_bin" verify --print-certs "$apk" 2>&1)"
          verify_ec=$?
          set -e
          if (( verify_ec != 0 )); then
            echo "apksigner verify exited ${verify_ec} for ${apk}" >&2
            printf '%s\n' "$cert_out"
            exit "$verify_ec"
          fi
          digest_line="$(grep -m1 -E 'SHA-256 digest:' <<<"$cert_out" || true)"
          if [[ -z "$digest_line" ]]; then
            echo "apksigner did not report an SHA-256 digest in --print-certs output" >&2
            exit 1
          fi
          actual="${digest_line#*: }"
          actual="${actual//[[:space:]]/}"
          actual_lc="${actual,,}"
          actual_lc="${actual_lc//:/}"
          expected="${ANDROID_RELEASE_CERT_SHA256//[[:space:]]/}"
          expected_lc="${expected,,}"
          expected_lc="${expected_lc//:/}"
          if [[ "$actual_lc" != "$expected_lc" ]]; then
            echo "Release APK signer SHA-256 does not match ANDROID_RELEASE_CERT_SHA256" >&2
            echo "APK signer SHA-256 (actual): ${actual_lc}"
            echo "apksigner --print-certs (first 6 lines):"
            head -n 6 <<<"$cert_out"
            exit 1
          fi
          echo "Release APK signature verified (SHA-256 matches ANDROID_RELEASE_CERT_SHA256)."
      - name: Upload signed release APK
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: zerona-android-release
          path: apps/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
      - name: Remove release keystore
        if: always() && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        run: rm -f "$RUNNER_TEMP/zerona-release.keystore"
